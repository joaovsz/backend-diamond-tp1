apiVersion: apps/v1
kind: Deployment
metadata:
  name: lead-service
  namespace: diamond
  labels:
    app: lead-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: lead-service
  template:
    metadata:
      labels:
        app: lead-service
    spec:
      containers:
        - name: lead-service
          image: diamond/lead-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          envFrom:
            - configMapRef:
                name: diamond-config
            - secretRef:
                name: diamond-secrets
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 800m
              memory: 768Mi
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 45
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: lead-data
              mountPath: /app/data
      volumes:
        - name: lead-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: lead-service
  namespace: diamond
spec:
  selector:
    app: lead-service
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
