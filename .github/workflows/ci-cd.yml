name: Diamond CRM CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  test-and-verify:
    name: Test & Static Analysis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Testar Discovery Server (Eureka)
        run: |
          echo "=== Executando testes unitários e de integração do Discovery Server ==="
          mvn -B test -f services/discovery-server/pom.xml

      - name: Testar Client Service
        run: |
          echo "=== Executando testes unitários e de integração do Client Service ==="
          mvn -B test -f services/client-service/pom.xml

      - name: Testar Lead Service
        run: |
          echo "=== Executando testes unitários e de integração do Lead Service ==="
          mvn -B test

  docker-build:
    name: Container Build & Lint
    needs: test-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Imagem Discovery Server
        uses: docker/build-push-action@v5
        with:
          context: ./services/discovery-server
          file: ./services/discovery-server/Dockerfile
          push: false
          tags: diamond/discovery-server:latest

      - name: Build Imagem Client Service
        uses: docker/build-push-action@v5
        with:
          context: ./services/client-service
          file: ./services/client-service/Dockerfile
          push: false
          tags: diamond/client-service:latest

      - name: Build Imagem Lead Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: diamond/lead-service:latest

  k8s-validate:
    name: Kubernetes Manifests Validation
    needs: docker-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Código Fonte
        uses: actions/checkout@v4

      - name: Configurar Kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: 'latest'

      - name: Validar Sintaxe dos Manifestos Kubernetes
        run: |
          echo "=== Validando manifestos K8s em k8s/ ==="
          python3 -c "
          import os, glob
          try:
              import yaml
              for f in sorted(glob.glob('k8s/*.yaml')):
                  with open(f) as fp:
                      list(yaml.safe_load_all(fp))
                  print(f'OK: {f}')
          except ImportError:
              print('PyYAML não instalado no runner padrão, fallback para script')
          "
